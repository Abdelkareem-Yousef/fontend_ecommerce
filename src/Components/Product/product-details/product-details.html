<div class="container py-5">
  <a routerLink="/" class="btn btn-link text-dark ps-0 mb-3">&larr; Back to home</a>

  @if (product) {
    <div class="row g-5 align-items-center">
      <div class="col-md-5">
        <div class="bg-light rounded p-4 text-center">
          <img [src]="product.image" [alt]="product.title" class="product-img" />
        </div>
      </div>

      <div class="col-md-7">
        <span class="badge bg-secondary mb-2 text-capitalize">{{ product.category }}</span>
        <h1 class="h3 fw-bold">{{ product.title }}</h1>

        @if (product.rating) {
          <p class="text-warning mb-2">
            <i class="bi bi-star-fill"></i> {{ product.rating.rate }}
            <span class="text-muted">({{ product.rating.count }} reviews)</span>
          </p>
        }

        <h2 class="text-success my-3">${{ product.price }}</h2>
        <p class="text-muted">{{ product.description }}</p>

        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-dark btn-lg flex-grow-1">
            <i class="bi bi-cart-plus me-1"></i> Add to Cart
          </button>
          <button class="btn btn-outline-danger btn-lg">
            <i class="bi bi-heart"></i>
          </button>
        </div>
      </div>
    </div>
  } @else if (error) {
    <div class="alert alert-danger">Couldn't load this product. Please try again.</div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border" role="status"></div>
    </div>
  }
</div>
