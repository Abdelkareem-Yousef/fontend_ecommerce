<div id="container" class="container my-5">
  <div class="row g-4">

    @for (x of id; track x.id) {
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card h-100 border-0 shadow-sm position-relative product-card">

          <!-- Wishlist heart -->
          <button class="btn btn-light btn-sm rounded-circle position-absolute top-0 end-0 m-2 shadow-sm">
            <i class="bi bi-heart text-danger"></i>
          </button>

          <img [src]="x.image" class="card-img-top p-4 bg-light" style="height:220px; object-fit:contain;" [alt]="x.title">

          <div class="card-body d-flex flex-column">
            <h6 class="card-title text-truncate" [title]="x.title">{{ x.title }}</h6>
            <p class="card-text fw-bold text-success mb-3">${{ x.price }}</p>
            <button class="btn btn-dark btn-sm w-100 mt-auto">
              <i class="bi bi-cart-plus me-1"></i> Add to Cart
            </button>
          </div>

        </div>
      </div>
    }

  </div>
</div>
