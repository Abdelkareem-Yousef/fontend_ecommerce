<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Nour store: page not found, the lamp above the cart is broken" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background boxes -->
  <g fill="#f4f5f9">
    <rect x="110" y="170" width="70" height="82"/>
    <rect x="180" y="195" width="45" height="57"/>
    <rect x="395" y="185" width="60" height="67"/>
    <rect x="455" y="160" width="50" height="92"/>
  </g>

  <!-- ceiling mount + cord -->
  <rect x="270" y="6" width="60" height="8" rx="4" fill="#d9dde8"/>
  <line x1="300" y1="14" x2="300" y2="66" stroke="#c9ceda" stroke-width="3" stroke-linecap="round"/>

  <!-- dashed "missing light" cone -->
  <g stroke="#d5d9e4" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round">
    <line x1="287" y1="126" x2="238" y2="170"/>
    <line x1="313" y1="126" x2="362" y2="170"/>
  </g>

  <!-- bulb (off, cracked) -->
  <circle cx="300" cy="106" r="15" fill="#f4f5f9" stroke="#c9ceda" stroke-width="3"/>
  <path d="M296 94 L303 103 L295 110 L303 119" fill="none" stroke="#aab1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shade -->
  <path d="M266 100 Q266 64 300 64 Q334 64 334 100 Z" fill="#dde1ea" stroke="#c9ceda" stroke-width="3" stroke-linejoin="round"/>

  <!-- glass shards -->
  <g fill="#e6e9f1" stroke="#c9ceda" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="280,136 288,140 282,148"/>
    <polygon points="318,138 326,134 324,145"/>
    <polygon points="304,146 310,152 302,154"/>
  </g>

  <!-- flicker sparks (yellow) -->
  <g stroke="#f3bf2b" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="326" y1="96" x2="336" y2="88"/>
      <line x1="332" y1="108" x2="344" y2="108"/>
      <line x1="326" y1="120" x2="336" y2="128"/>
      <animate attributeName="opacity" values="1;0.15;1;0.15;0.15;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <line x1="274" y1="96" x2="264" y2="88"/>
      <line x1="268" y1="108" x2="256" y2="108"/>
      <line x1="274" y1="120" x2="264" y2="128"/>
      <animate attributeName="opacity" values="0.15;1;0.15;1;0.15;0.15" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- shadow + ground -->
  <ellipse cx="300" cy="266" rx="95" ry="5" fill="#eef0f5"/>
  <line x1="90" y1="258" x2="510" y2="258" stroke="#c9ceda" stroke-width="3" stroke-linecap="round"/>
  <circle cx="76" cy="258" r="3" fill="#c9ceda"/>
  <circle cx="524" cy="258" r="3" fill="#c9ceda"/>

  <!-- cart -->
  <path d="M206 160 H228 L242 178" fill="none" stroke="#c9ceda" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M238 178 H378 L362 234 H254 Z" fill="#e6e9f1" stroke="#c9ceda" stroke-width="3" stroke-linejoin="round"/>
  <text x="308" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#aab1c4">404</text>
  <circle cx="274" cy="246" r="9" fill="#f4f5f9" stroke="#c9ceda" stroke-width="3"/>
  <circle cx="344" cy="246" r="9" fill="#f4f5f9" stroke="#c9ceda" stroke-width="3"/>
</svg>
