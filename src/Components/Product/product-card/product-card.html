<div class="card h-100 shadow-sm product-card">
  <img [src]="product.image" [alt]="product.title" class="card-img-top p-3" />
  <div class="card-body d-flex flex-column">
    <span class="badge bg-light text-dark align-self-start mb-2">
      {{ product.category }}
    </span>
    <h6 class="card-title">{{ product.title }}</h6>
    <p class="fw-bold text-primary mt-auto mb-3">{{ product.price }}$</p>
    <a [routerLink]="['/product', product.id]" class="btn btn-outline-primary">
      View details
    </a>
  </div>
</div>
